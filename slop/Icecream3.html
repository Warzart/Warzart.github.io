<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ijsjes Maker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            overflow: hidden;
            background: #fdf2f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Ijsbakken - gefixeerd bovenaan */
        .bin-container {
            height: 85px;
            background: white;
            border-bottom: 3px solid #fbcfe8;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px;
            z-index: 100;
            flex-shrink: 0;
        }

        .ice-bin {
            width: 18%;
            height: 65px;
            border-radius: 12px;
            border: 3px solid #f3f4f6;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Werkgebied - Flexibele container die het ijsje laat zakken */
        .work-area {
            flex: 1;
            position: relative;
            overflow: hidden; /* We beheren scrollen via JS/CSS transform */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-top: 50px; /**/
        }

        #ice-cream-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .cone {
            width: 100px;
            height: 130px;
            background: #e5a964;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            position: relative;
            z-index: 100;
        }

        .cone::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                repeating-linear-gradient(45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 8px, transparent 8px, transparent 16px),
                repeating-linear-gradient(-45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 8px, transparent 8px, transparent 16px);
        }

        .bolletjes-stapel {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            z-index: 15;
            margin-bottom: 15px;
        }

        .bolletje {
            width: 90px;
            height: 80px;
            border-radius: 50% 50% 45% 45%;
            margin-bottom: -45px;
            position: relative;
            box-shadow: inset -6px -6px 12px rgba(0,0,0,0.15);
            transition: opacity 0.3s ease;
        }

        /* De Schep */
        .scoop {
            width: 75px;
            height: 75px;
            position: fixed;
            pointer-events: none;
            z-index: 2000;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        /* Knoppenbalk - gefixeerd onderaan met transparantie */
        .bottom-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            height: 90px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #fbcfe8;
            z-index: 500;
            flex-shrink: 0;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            border: 2px solid #fce7f3;
            pointer-events: auto; /* Zorg dat ze altijd klikbaar zijn */
        }

        .whipped-cream {
            width: 95px;
            height: 70px;
            background: #fff;
            border-radius: 50% 50% 20% 20%;
            position: relative;
            margin-bottom: -20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 25;
        }

        .sprinkle {
            position: absolute;
            width: 4px;
            height: 8px;
            border-radius: 2px;
        }

        .animal-overlay {
            position: fixed;
            top: 25%; left: -350px;
            width: 300px;
            height: 300px;
            font-size: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.8s ease-out;
            z-index: 1000;
            pointer-events: none;
        }

        .nom-text {
            position: fixed;
            color: #db2777;
            font-weight: 900;
            font-size: 45px;
            animation: float-up 0.8s forwards;
            pointer-events: none;
            z-index: 1100;
            text-shadow: 3px 3px 0 white;
        }

        @keyframes float-up {
            0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1.6); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bin-container">
        <div class="ice-bin" data-color="#ff99bb" style="background: #ff99bb;"></div>
        <div class="ice-bin" data-color="#fff9c4" style="background: #fff9c4;"></div>
        <div class="ice-bin" data-color="#795548" style="background: #795548;"></div>
        <div class="ice-bin" data-color="#b2ff59" style="background: #b2ff59;"></div>
        <div class="ice-bin" data-color="#81d4fa" style="background: #81d4fa;"></div>
    </div>

    <div class="work-area" id="stage">
        <div id="ice-cream-container">
            <div class="bolletjes-stapel" id="stack"></div>
            <div class="cone" id="cone-target"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-circle" onclick="addSprinkles()">✨</button>
        <button class="btn-circle" onclick="addCream()">☁️</button>
        <button class="btn-circle" onclick="startEating()">👅</button>
        <button class="btn-circle" onclick="resetGame()">🗑️</button>
    </div>

    <div id="scooper" class="scoop">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="40" r="42" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
            <rect x="46" y="80" width="8" height="20" rx="4" fill="#475569" />
            <circle id="scoop-content" cx="50" cy="40" r="36" fill="transparent" />
        </svg>
    </div>

    <div id="animal" class="animal-overlay">🦄</div>

<script>
    const scooper = document.getElementById('scooper');
    const scoopContent = document.getElementById('scoop-content');
    const stack = document.getElementById('stack');
    const bins = document.querySelectorAll('.ice-bin');
    const coneTarget = document.getElementById('cone-target');
    const iceCreamContainer = document.getElementById('ice-cream-container');
    const animal = document.getElementById('animal');

    let currentFlavor = null;
    let hasCream = false;
    let isEating = false;
    let currentYOffset = 0;

    const playNomSound = () => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    };

    const handleMovement = (e) => {
        if (isEating) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        
        scooper.style.left = x + 'px';
        scooper.style.top = y + 'px';

        // Bakjes checken
        bins.forEach(bin => {
            const rect = bin.getBoundingClientRect();
            if (x > rect.left && x < rect.right && y > rect.top && y < rect.bottom) {
                currentFlavor = bin.dataset.color;
                scoopContent.setAttribute('fill', currentFlavor);
            }
        });

        // Dropzone checken (altijd bovenop)
        if (currentFlavor) {
            const topEl = stack.children.length > 0 ? stack.lastElementChild : coneTarget;
            const rect = topEl.getBoundingClientRect();
            if (x > rect.left - 40 && x < rect.right + 40 && y > rect.top - 60 && y < rect.bottom) {
                addScoop(currentFlavor);
                currentFlavor = null;
                scoopContent.setAttribute('fill', 'transparent');
            }
        }
    };

    const addScoop = (color) => {
        if (hasCream) return;
        const bol = document.createElement('div');
        bol.className = 'bolletje';
        bol.style.backgroundColor = color;
        stack.appendChild(bol);
        adjustView();
    };

    const addCream = () => {
        if (stack.children.length === 0 || hasCream || isEating) return;
        const cream = document.createElement('div');
        cream.className = 'whipped-cream';
        stack.appendChild(cream);
        hasCream = true;
        adjustView();
    };

    const addSprinkles = () => {
        if (stack.children.length === 0 || isEating) return;
        const target = stack.lastElementChild;
        if (target.querySelector('.s-wrap')) return;
        const wrap = document.createElement('div');
        wrap.className = 's-wrap';
        wrap.style.cssText = 'position:absolute;width:100%;height:100%';
        for (let i = 0; i < 20; i++) {
            const s = document.createElement('div');
            s.className = 'sprinkle';
            s.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 60%)`;
            s.style.left = (20+Math.random()*60)+'%';
            s.style.top = (15+Math.random()*40)+'%';
            s.style.transform = `rotate(${Math.random()*360}deg)`;
            wrap.appendChild(s);
        }
        target.appendChild(wrap);
    };

    // De belangrijkste functie: Beheer het gezichtspunt /**/
    const adjustView = () => {
      
        const stackHeight = stack.offsetHeight;
        const viewportHeight = window.innerHeight;
        const limit = viewportHeight * 0.4; // Punt waar we ijsje omlaag drukken

        // Als het ijsje hoger wordt dan 40% van het scherm, schuiven we de container omlaag
        if (stackHeight > limit) {
            currentYOffset = stackHeight - limit;
            iceCreamContainer.style.transform = `translateY(${currentYOffset}px)`;
        }
    };

    const startEating = () => {
        if (stack.children.length === 0 || isEating) return;
        isEating = true;
        
        const animals = ['🦄', '🦖', '🐼', '🦁', '🐷', '🐰'];
        animal.innerText = animals[Math.floor(Math.random() * animals.length)];
        animal.style.left = 'calc(50% - 150px)';
        
        setTimeout(() => {
            const items = Array.from(stack.children).reverse();
            let i = 0;
            const interval = setInterval(() => {
                if (i < items.length) {
                    playNomSound();
                    const text = document.createElement('div');
                    text.className = 'nom-text';
                    text.innerText = 'HAP!';
                    text.style.left = '50%'; text.style.top = '40%';
                    document.body.appendChild(text);
                    setTimeout(() => text.remove(), 800);
                    
                    items[i].style.opacity = '0';
                    const targetItem = items[i];
                    setTimeout(() => {
                        targetItem.remove();
                        adjustView(); // Camera weer omhoog bijsturen
                    }, 250);
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        animal.style.left = '120%';
                        setTimeout(() => {
                            animal.style.left = '-350px';
                            hasCream = false;
                            isEating = false;
                            currentYOffset = 0;
                            iceCreamContainer.style.transform = 'translateY(0)';
                        }, 1000);
                    }, 500);
                }
            }, 700);
        }, 1000);
    };

    const resetGame = () => {
        if (isEating) return;
        stack.innerHTML = '';
        hasCream = false;
        currentYOffset = 0;
        iceCreamContainer.style.transform = 'translateY(0)';
        currentFlavor = null;
        scoopContent.setAttribute('fill', 'transparent');
    };

    window.addEventListener('mousemove', handleMovement);
    window.addEventListener('touchmove', handleMovement, { passive: false });
    scooper.style.left = '-100px';
</script>
</body>
</html>
