<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stuiterende Diertjes & Emoji's</title>
    <style>
        /* --- NATIVE CSS RESET & BASIS STYLING (Geen externe Tailwind nodig!) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1b4b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: fixed; 
            top: 0;
            left: 0;
        }

        /* Dynamische Gradiënt-Thema's */
        .thema-0 { background: linear-gradient(135deg, #1e1b4b, #3b0764, #500724); } /* Magisch Kosmisch */
        .thema-1 { background: linear-gradient(135deg, #022c22, #042f2e, #083344); } /* Diepe Oceaan */
        .thema-2 { background: linear-gradient(135deg, #451a03, #450a0a, #431407); } /* Warme Zonsondergang */
        .thema-3 { background: linear-gradient(135deg, #0f172a, #09090b, #1c1917); } /* Minimalistisch Donker */
        .thema-4 { background: linear-gradient(135deg, #500724, #4c0519, #450a0a); } /* Liefdevol Roze */

        /* Canvas vult het hele scherm */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            pointer-events: none;
        }

        /* --- MODERN GLAS-EFFECT UI ELEMENTEN --- */
        .glaseffect {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #ffffff;
            font-weight: 600;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .header-pill {
            padding: 10px 18px;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .header-pill h1 {
            font-size: 16px;
            font-weight: 700;
        }

        .teller-accent {
            color: #facc15;
            font-weight: 800;
        }

        /* Midden Instructie */
        #instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 340px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .instruction-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        .instruction-emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .instruction-card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .instruction-card p {
            font-size: 13px;
            color: #f472b6;
            line-height: 1.4;
        }

        /* Onderkant / Knoppen */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }

        /* Actie-knoppen */
        .btn {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .btn-theme {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-theme:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-clear:active {
            background: rgba(239, 68, 68, 0.4);
            transform: scale(0.95);
        }

        /* Zachte pulse-animatie voor de instructie */
        @keyframes zachtePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .pulse-instructie {
            animation: zachtePulse 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="thema-0">

    <!-- Canvas die het hele scherm vult -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay (Bovenkant) -->
    <header>
        <div class="header-pill glaseffect">
            <h1>🎉 Stuiterpret!</h1>
        </div>
        <div class="header-pill glaseffect">
            <span>Actief: <span id="counter" class="teller-accent">0</span></span>
        </div>
    </header>

    <!-- UI Overlay (Midden - Instructie) -->
    <div id="instruction">
        <div class="instruction-card pulse-instructie">
            <span class="instruction-emoji">👇</span>
            <h2>Tik of klik ergens!</h2>
            <p>Laat vrolijke diertjes verschijnen. Ze stuiteren 4 keer en ontploffen dan in confetti!</p>
        </div>
    </div>

    <!-- UI Overlay (Onderkant - Instellingen en knoppen) -->
    <footer>
        <button id="themeBtn" class="btn btn-theme">🎨 Sfeer Wisselen</button>
        <button id="clearBtn" class="btn btn-clear">💥 Alles Wissen</button>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const counterEl = document.getElementById('counter');
        const instructionEl = document.getElementById('instruction');
        const themeBtn = document.getElementById('themeBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Lijst met vrolijke emoji's en diertjes
        const vrolijkeEmojis = [
            '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', 
            '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆', 
            '🦅', '🦉', '🦇', '🐺', '🐗', '🦄', '🐝', '🐛', '🦋', '🐞', 
            '🐙', '🐡', '🐠', '🐟', '🐬', '🐳', '🐒', '🦍', '🦧', '🐕', 
            '🐈', '🐎', '🐖', '🐑', '🐐', '🐪', '🦒', '🐘', '🦣', '🦏', 
            '🐿️', '🦔', '🦖', '🦕', '🦦', '🦥', '🦘', '🦄', '🥳', '😎', 
            '🤩', '🤪', '👾', '🚀', '⭐', '🌈', '🍦', '🍕', '🍩', '🎈'
        ];

        let huidigThemaIndex = 0;
        const totaalThemas = 5;

        // Lijsten om actieve objecten bij te houden
        let diertjes = [];
        let confettiDeeltjes = [];
        let eersteTikGeweest = false;

        // Globale logische canvas dimensies
        let logicalWidth = window.innerWidth;
        let logicalHeight = window.innerHeight;

        // Canvas schalen voor scherpe weergave op hoge-resolutie (Retina) schermen
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            
            // Haal de echte logische viewport-grootte op in CSS pixels
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            
            // Stel de fysieke resolutie van de canvas-bitmap in
            canvas.width = logicalWidth * dpr;
            canvas.height = logicalHeight * dpr;
            
            // Dwing de exacte weergavegrootte af in CSS pixels
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';
            
            // Reset transforms en pas de hoge-resolutieschaling toe
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }
        
        // Zorg ervoor dat resizen soepel verloopt bij schermrotaties op mobiel
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 200);
        });
        window.addEventListener('load', resizeCanvas);
        resizeCanvas();

        // Diertje/Emoji Klasse
        class Diertje {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Kies een willekeurige emoji
                this.emoji = vrolijkeEmojis[Math.floor(Math.random() * vrolijkeEmojis.length)];
                
                // Bepaal de grootte op basis van de actuele logische breedte
                const isMobiel = logicalWidth < 768;
                this.size = isMobiel ? Math.random() * 10 + 35 : Math.random() * 20 + 45; // Tussen 35px en 65px
                
                // Willekeurige hoek en rustige stuiter-snelheid
                const hoek = Math.random() * Math.PI * 2;
                const snelheid = isMobiel ? Math.random() * 1 + 1.8 : Math.random() * 1.5 + 2.2; 
                this.vx = Math.cos(hoek) * snelheid;
                this.vy = Math.sin(hoek) * snelheid;

                this.bounces = 0;
                this.maxBounces = 4;
                
                // Rotatie-effecten voor extra dynamiek
                this.rotatie = 0;
                this.rotatieSnelheid = (Math.random() - 0.5) * 0.04;

                // Schaaleffect bij het spawnen
                this.schaal = 0.1;
            }

            update() {
                // Groeianimatie bij spawn
                if (this.schaal < 1) {
                    this.schaal += 0.15;
                    if (this.schaal > 1) this.schaal = 1;
                }

                // Beweeg het diertje
                this.x += this.vx;
                this.y += this.vy;
                this.rotatie += this.rotatieSnelheid;

                let geraakt = false;
                let botsingX = this.x;
                let botsingY = this.y;

                const straal = this.size / 2;

                // Botsing met linker- en rechterrand (gebruik makend van de logische breedte)
                if (this.x - straal <= 0) {
                    this.vx = Math.abs(this.vx);
                    this.x = straal;
                    geraakt = true;
                    botsingX = 0;
                } else if (this.x + straal >= logicalWidth) {
                    this.vx = -Math.abs(this.vx);
                    this.x = logicalWidth - straal;
                    geraakt = true;
                    botsingX = logicalWidth;
                }

                // Botsing met boven- en onderrand
                if (this.y - straal <= 0) {
                    this.vy = Math.abs(this.vy);
                    this.y = straal;
                    geraakt = true;
                    botsingY = 0;
                } else if (this.y + straal >= logicalHeight) {
                    this.vy = -Math.abs(this.vy);
                    this.y = logicalHeight - straal;
                    geraakt = true;
                    botsingY = logicalHeight;
                }

                // Als er een botsing is geweest, verhoog de teller
                if (geraakt) {
                    this.bounces++;
                    
                    // Maak een kleine impact-confetti bij elke stuiter
                    maakConfetti(botsingX, botsingY, 6, ['#ffffff', '#ffeb3b', '#e91e63']);

                    if (this.bounces >= this.maxBounces) {
                        // Grote confetti-explosie bij de 4e stuiter
                        maakConfetti(this.x, this.y, 30);
                        return false; // Geeft aan dat dit diertje verwijderd moet worden
                    }
                }
                return true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotatie);
                ctx.scale(this.schaal, this.schaal);
                
                // Teken de emoji mooi in het midden (met fallback fonts)
                ctx.font = `${this.size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Zachte schaduw achter de emoji's
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 4;
                
                ctx.fillText(this.emoji, 0, 0);
                
                ctx.restore();
            }
        }

        // Confetti Deeltjes Klasse
        class Confetti {
            constructor(x, y, specifiekeKleuren = null) {
                this.x = x;
                this.y = y;
                
                // Bepaal de grootte van het deeltje
                this.size = Math.random() * 5 + 3;
                
                // Willekeurige richting en snelheid voor de explosie
                const hoek = Math.random() * Math.PI * 2;
                const snelheid = Math.random() * 4 + 1.2;
                this.vx = Math.cos(hoek) * snelheid;
                this.vy = Math.sin(hoek) * snelheid;
                
                // Zwaartekracht die de confetti naar beneden trekt
                this.zwaartekracht = 0.08;
                
                // Kleurselectie
                const kleuren = specifiekeKleuren || [
                    '#FFC107', '#FF5722', '#E91E63', '#9C27B0', 
                    '#3F51B5', '#00BCD4', '#4CAF50', '#8BC34A',
                    '#FFEB3B', '#FF2E93', '#2EFFC4', '#D4FF2E'
                ];
                this.color = kleuren[Math.floor(Math.random() * kleuren.length)];
                
                // Levensduur/transparantie van de confetti
                this.alpha = 1;
                this.fadeSpeed = Math.random() * 0.02 + 0.015;
                
                // Vorm (0 = cirkel, 1 = vierkant, 2 = driehoek)
                this.vorm = Math.floor(Math.random() * 3);
                this.rotatie = Math.random() * Math.PI;
                this.rotatieSnelheid = (Math.random() - 0.5) * 0.15;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.zwaartekracht;
                this.rotatie += this.rotatieSnelheid;
                this.alpha -= this.fadeSpeed;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotatie);
                ctx.fillStyle = this.color;

                ctx.beginPath();
                if (this.vorm === 0) {
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                } else if (this.vorm === 1) {
                    ctx.rect(-this.size / 2, -this.size / 2, this.size, this.size);
                } else {
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(this.size / 2, this.size / 2);
                    ctx.lineTo(-this.size / 2, this.size / 2);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        // Functie om confetti aan te maken op een locatie
        function maakConfetti(x, y, aantal, kleuren = null) {
            for (let i = 0; i < aantal; i++) {
                confettiDeeltjes.push(new Confetti(x, y, kleuren));
            }
        }

        // De hoofd-animatieloop
        function gameLoop() {
            // Maak de canvas schoon bij elke frame
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            // Update en teken alle actieve diertjes
            diertjes = diertjes.filter(diertje => {
                const blijftLeven = diertje.update();
                if (blijftLeven) {
                    diertje.draw();
                }
                return blijftLeven;
            });

            // Update en teken alle confettideeltjes
            confettiDeeltjes = confettiDeeltjes.filter(deeltje => {
                const blijftLeven = deeltje.update();
                if (blijftLeven) {
                    deeltje.draw();
                }
                return blijftLeven;
            });

            // Werk de teller in de UI bij
            counterEl.textContent = diertjes.length;

            // Blijf de loop herhalen
            requestAnimationFrame(gameLoop);
        }

        // Start de animatieloop direct
        gameLoop();

        // Luister naar interacties (zowel muisklikken als aanrakingen)
        function handhaafInteractie(e) {
            // Voorkom dat er diertjes spawnen als je op de UI-knoppen klikt
            if (e.target.closest('button') || e.target.closest('header')) {
                return;
            }

            // Haal de juiste coördinaten op, of het nu een touch of click is
            let x, y;
            if (e.touches && e.touches[0]) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            // Verberg de instructie bij de allereerste interactie
            if (!eersteTikGeweest) {
                instructionEl.style.opacity = '0';
                setTimeout(() => {
                    instructionEl.style.display = 'none';
                }, 500);
                eersteTikGeweest = true;
            }

            // Maak een nieuw diertje aan op de getikte locatie
            diertjes.push(new Diertje(x, y));

            // Voeg een heel klein tik-confetti-effect toe op de vinger/muis positie
            maakConfetti(x, y, 5, ['#ffffff', 'rgba(255,255,255,0.5)']);
        }

        // Koppel de events voor optimale responsiviteit op mobiel
        window.addEventListener('mousedown', handhaafInteractie);
        window.addEventListener('touchstart', (e) => {
            // Laat touch-interactie op knoppen gewoon doorgaan
            if (e.target.closest('button')) {
                return;
            }
            e.preventDefault(); // Voorkom zoomen/scrollen op het speelveld zelf
            handhaafInteractie(e);
        }, { passive: false });

        // Thema/Achtergrond wisselen knop logica
        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // Verwijder huidige verloopklasse
            document.body.classList.remove(`thema-${huidigThemaIndex}`);
            
            // Ga naar volgende thema
            huidigThemaIndex = (huidigThemaIndex + 1) % totaalThemas;
            
            // Voeg de nieuwe verloopklasse toe
            document.body.classList.add(`thema-${huidigThemaIndex}`);

            // Spawnt feestelijke confetti om de sfeerwisseling te vieren!
            maakConfetti(logicalWidth / 2, logicalHeight / 2, 40);
        });

        // Alles wissen knop logica
        clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (diertjes.length > 0) {
                // Laat alle diertjes tegelijk ontploffen in een mega-explosie!
                diertjes.forEach(d => {
                    maakConfetti(d.x, d.y, 15);
                });
                diertjes = [];
            }
        });
    </script>
</body>
</html>
